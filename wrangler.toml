# 草诀歌 AI Labs 会议白板 —— Cloudflare Pages
name = "caojuege-meeting-board"
compatibility_date = "2025-03-01"
pages_build_output_dir = "dist"

# 部署前执行: npx wrangler kv namespace create BOARD_KV
# 将返回的 id 填入下方；Dashboard 连接 GitHub 时也可在设置里绑定同名 BOARD_KV
[[kv_namespaces]]
binding = "BOARD_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_NAMESPACE_ID"
