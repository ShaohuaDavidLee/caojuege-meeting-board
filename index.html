<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="description" content="兰亭白板 —— 实时协同的会议白板：提问、投票、标记已答，散会带走一份问题清单。主会议间「草诀歌 AI Labs」长期开放，也可以另开一间。" />
    <meta property="og:title" content="兰亭白板" />
    <meta property="og:description" content="草诀歌 AI Labs 的会议白板。开一个链接，所有人一起写，散会带走一份问题清单。" />
    <meta property="og:type" content="website" />
    <title>兰亭白板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <script>
      // 先于 React 挂载：换了皮肤的用户不该先闪一帧现在的皮肤。
      // ?theme= 优先于本机记忆；白标域名上默认礼仪皮
      try {
        var t = new URLSearchParams(location.search).get("theme") ||
          localStorage.getItem("caojuege-board-theme") ||
          (location.hostname === "baiban.asone.ing" ? "faith" : "");
        if (t === "hard" || t === "faith") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
